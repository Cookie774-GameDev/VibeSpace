          '@ | Set-Content (Join-Path $env:NSIS_PROOF_DIR 'inspect.mjs') -Encoding utf8NoBOM
      - name: Provision integrity-pinned NSIS and full extraction tooling
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:RUNNER_TEMP 's61-nsis-tools'
          if (Test-Path $tools) { throw 'Fresh tool directory required.' }
          New-Item -ItemType Directory $tools | Out-Null
          $archive = Join-Path $tools '7z2603-x64.exe'
          Invoke-WebRequest 'https://github.com/ip7z/7zip/releases/download/26.03/7z2603-x64.exe' -OutFile $archive
          if ((Get-FileHash $archive).Hash.ToLowerInvariant() -cne '0859c524b8a63551848f0c246abddcb1d0b7b656b0fbfe879f8d85e61a9e6edd') { throw 'Official 7-Zip 26.03 archive digest mismatch.' }
          $bootstrap = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          if (-not (Test-Path $bootstrap)) { throw 'Runner image 7-Zip unavailable; no installer fallback.' }
          $full = Join-Path $tools 'full-7zip'
          node (Join-Path $env:NSIS_PROOF_DIR 'inspect.mjs') extract $bootstrap $archive $full
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $seven = Join-Path $full '7z.exe'
          if (-not (Test-Path $seven) -or -not (Test-Path (Join-Path $full '7z.dll'))) { throw 'Full NSIS-capable 7-Zip tools missing.' }
          $sevenVersion = & $seven i
          if ($LASTEXITCODE -ne 0 -or ($sevenVersion -join "`n") -notmatch '7-Zip 26\.03') { throw '7-Zip version mismatch.' }
          $zip = Join-Path $tools 'nsis-3.11.zip'
          Invoke-WebRequest 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA1).Hash -cne 'EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D') { throw 'Tauri-pinned NSIS archive mismatch.' }
          $cache = Join-Path $env:LOCALAPPDATA 'tauri'
          $nsis = Join-Path $cache 'NSIS'
          if (Test-Path $nsis) { throw 'Refusing unverified existing NSIS cache.' }
          $unpacked = Join-Path $tools 'nsis-extracted'
          node (Join-Path $env:NSIS_PROOF_DIR 'inspect.mjs') extract $seven $zip $unpacked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path $cache -Force | Out-Null
          Move-Item -LiteralPath (Join-Path $unpacked 'nsis-3.11') -Destination $nsis
          $plugin = Join-Path $nsis 'Plugins/x86-unicode/additional/nsis_tauri_utils.dll'
          New-Item -ItemType Directory -Path (Split-Path $plugin) -Force | Out-Null
          Invoke-WebRequest 'https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll' -OutFile $plugin
          if ((Get-FileHash $plugin -Algorithm SHA1).Hash -cne '75197FEE3C6A814FE035788D1C34EAD39349B860') { throw 'Tauri NSIS plugin mismatch.' }
          $compilerVersion = & (Join-Path $nsis 'makensis.exe') /VERSION
          if ($LASTEXITCODE -ne 0 -or $compilerVersion -notmatch '3\.11') { throw 'NSIS compiler version mismatch.' }
          @{ cli='2.11.2'; sevenZip='26.03'; sevenZipArchiveSHA256=(Get-FileHash $archive).Hash; sevenZipExeSHA256=(Get-FileHash $seven).Hash; sevenZipDllSHA256=(Get-FileHash (Join-Path $full '7z.dll')).Hash; runnerBootstrapSHA256=(Get-FileHash $bootstrap).Hash; runnerImage=$env:ImageVersion; nsisVersion=$compilerVersion; nsisArchiveSHA1=(Get-FileHash $zip -Algorithm SHA1).Hash; nsisCompilerSHA256=(Get-FileHash (Join-Path $nsis 'makensis.exe')).Hash; nsisPluginSHA1=(Get-FileHash $plugin -Algorithm SHA1).Hash } | ConvertTo-Json | Set-Content (Join-Path $env:NSIS_PROOF_DIR 'tool-manifest.json')
          "NSIS_SEVEN_ZIP=$seven" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Prepare verified resource inputs
        run: |
          node --test scripts/tauri-windows-resource-contract.test.mjs scripts/windows-runtime-dlls.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run prepare:desktop-connector
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run prepare:siyuan-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --input-type=module -e "import assert from 'node:assert/strict'; import {fingerprint} from './scripts/prepare-desktop-connector.mjs'; assert.equal(await fingerprint(),process.env.QA_CONNECTOR_SHA256);"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Admit and build unsigned NSIS release package
        run: |
          & (Join-Path $env:NSIS_PROOF_DIR 'admit.ps1') before-build
          if (Test-Path -LiteralPath $env:CARGO_TARGET_DIR) { throw 'Fresh isolated Cargo target required.' }
          npm --prefix app run tauri:build -- --bundles nsis --no-sign --ci --config $env:NSIS_QA_CONFIG -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash 'app/src-tauri/Cargo.lock').Hash.ToLowerInvariant() -cne $env:QA_CARGO_LOCK_SHA256) { throw 'Build changed frozen Cargo lock.' }
      - name: Inspect actual extracted NSIS DLL and resource closure
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem -LiteralPath (Join-Path $env:CARGO_TARGET_DIR 'release/bundle/nsis') -Filter '*.exe' -File)
          if ($packages.Count -ne 1) { throw 'Exactly one unsigned NSIS artifact required.' }
          $package = $packages[0].FullName
          $extracted = Join-Path $env:RUNNER_TEMP 's61-nsis-extracted'
          node (Join-Path $env:NSIS_PROOF_DIR 'inspect.mjs') extract $env:NSIS_SEVEN_ZIP $package $extracted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'MSVC inspection tools unavailable.' }
          $dumpbin = Get-ChildItem -Path (Join-Path $vs 'VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe') -File | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin unavailable.' }
          Copy-Item -LiteralPath $package -Destination $env:NSIS_PROOF_DIR
          node (Join-Path $env:NSIS_PROOF_DIR 'inspect.mjs') prove $extracted (Join-Path $env:CARGO_TARGET_DIR 'release/jarvis.exe') $package $dumpbin.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath $env:NSIS_QA_CONFIG -Destination $env:NSIS_PROOF_DIR
      - name: Upload unsigned package and static proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-nsis-proof-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/s61-nsis-proof/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
      - name: Upload package diagnostics even on a failed proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-nsis-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/s61-nsis-proof/*.json
            work/s61-nsis-proof/*.txt
            work/s61-nsis-proof/*.ps1
            work/s61-nsis-proof/*.mjs
            work/s61-nsis-proof/*.exe
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6
