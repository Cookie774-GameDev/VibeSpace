name: Native Windows debug QA artifact

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Frozen published source commit (full SHA)
        required: true
        type: string
      cargo_lock_sha256:
        description: Frozen .github/native-windows-qa/Cargo.lock SHA-256
        required: true
        type: string
      windows_config_sha256:
        description: Frozen Windows resource configuration SHA-256
        required: true
        type: string
      connector_source_sha256:
        description: Expected connector source fingerprint from the frozen packet
        required: true
        type: string
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      cargo_lock_sha256:
        required: true
        type: string
      windows_config_sha256:
        required: true
        type: string
      connector_source_sha256:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-windows-qa-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      QA_SOURCE_SHA: ${{ inputs.source_sha }}
      QA_CARGO_LOCK_SHA256: ${{ inputs.cargo_lock_sha256 }}
      QA_WINDOWS_CONFIG_SHA256: ${{ inputs.windows_config_sha256 }}
      QA_CONNECTOR_SHA256: ${{ inputs.connector_source_sha256 }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/work/native-windows-qa-target
      ORT_CACHE_DIR: ${{ github.workspace }}/work/native-windows-qa-target/ort-cache
      CARGO_BUILD_JOBS: '1'
    steps:
      - name: Validate immutable source inputs
        run: |
          # Hash the published blob bytes consistently on this isolated runner.
          git config --global core.autocrlf false
          git config --global core.eol lf
          if ($env:QA_SOURCE_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'Full source SHA required.' }
          foreach ($value in @($env:QA_CARGO_LOCK_SHA256, $env:QA_WINDOWS_CONFIG_SHA256, $env:QA_CONNECTOR_SHA256)) {
            if ($value -cnotmatch '^[a-f0-9]{64}$') { throw 'Full lowercase SHA-256 inputs required.' }
          }

      - name: Initialize isolated runner paths
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP) -or [string]::IsNullOrWhiteSpace($env:GITHUB_ENV)) { throw 'Runner temp and environment file required.' }
          $connectorDirectory = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'native-windows-qa-connector'
          $siyuanDirectory = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'native-windows-qa-siyuan'
          @(
            "VIBESPACE_CONNECTOR_BUILD_DIR=$connectorDirectory"
            "VIBESPACE_SIYUAN_CACHE_DIR=$siyuanDirectory"
          ) | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append -ErrorAction Stop

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify source and frozen dependency/resource inputs
        run: |
          if ((git rev-parse HEAD) -cne $env:QA_SOURCE_SHA) { throw 'Checkout source mismatch.' }
          $lock = '.github/native-windows-qa/Cargo.lock'
          if ((Get-FileHash -LiteralPath $lock).Hash.ToLowerInvariant() -cne $env:QA_CARGO_LOCK_SHA256) { throw 'Cargo lock mismatch.' }
          if ((Get-FileHash -LiteralPath 'app/src-tauri/tauri.windows.conf.json').Hash.ToLowerInvariant() -cne $env:QA_WINDOWS_CONFIG_SHA256) { throw 'Windows resource configuration mismatch.' }
          Copy-Item -LiteralPath $lock -Destination 'app/src-tauri/Cargo.lock'

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Verify Windows first-install contracts
        if: ${{ hashFiles('install/install.ps1', 'scripts/install-windows.test.mjs') != '' }}
        run: |
          node --test scripts/install-windows.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/src-tauri
          cache-targets: false
          key: native-windows-qa-1.96.0

      - name: Verify focused source contracts
        run: |
          node --test scripts/native-windows-qa.test.mjs scripts/tauri-windows-resource-contract.test.mjs scripts/windows-runtime-dlls.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Admit resource preparation
        run: ./scripts/native-windows-qa-preflight.ps1 -Phase before-prepare

      - name: Prepare verified resources with existing hooks
        run: |
          npm run prepare:desktop-connector
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run prepare:siyuan-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Snapshot exact source and prepared resource inputs
        run: node scripts/native-windows-qa.mjs snapshot

      - name: Admit and build debug executable
        run: node scripts/native-windows-qa.mjs build

      - name: Admit and test focused Workbench Rust regressions on the warm target
        run: |
          $ErrorActionPreference = 'Stop'
          $global:LASTEXITCODE = 0
          ./scripts/native-windows-qa-preflight.ps1 -Phase before-cargo -EvidenceDirectory work/native-windows-qa/workbench-tests-admission
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rustManifest = Join-Path $env:GITHUB_WORKSPACE 'app/src-tauri/Cargo.toml'
          $rustOutput = Join-Path $env:GITHUB_WORKSPACE 'work/native-windows-qa/workbench-tests'
          $rustInputPaths = [ordered]@{
            testScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/s61-workbench-rust-tests.ps1'
            cargoManifest = $rustManifest
            cargoLock = Join-Path $env:GITHUB_WORKSPACE 'app/src-tauri/Cargo.lock'
          }
          $rustInputHashes = [ordered]@{}
          foreach ($key in $rustInputPaths.Keys) {
            $rustInputHashes[$key] = (Get-FileHash -LiteralPath $rustInputPaths[$key] -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          if ($rustInputHashes.cargoLock -cne $env:QA_CARGO_LOCK_SHA256) { throw 'Rust test lock does not match the frozen QA lock.' }
          $rustHead = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $rustHead -cne $env:QA_SOURCE_SHA) { throw 'Rust test source commit mismatch.' }
          $rustPublishedScript = git rev-parse 'HEAD:scripts/s61-workbench-rust-tests.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prove published Rust test script.' }
          $rustWorkingScript = git hash-object -- scripts/s61-workbench-rust-tests.ps1
          if ($LASTEXITCODE -ne 0 -or $rustWorkingScript -cne $rustPublishedScript) { throw 'Rust test script differs from the frozen published source.' }
          $rustTarget = [IO.Path]::GetFullPath($env:CARGO_TARGET_DIR)
          ./scripts/s61-workbench-rust-tests.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -OutputDirectory $rustOutput -IncludeRestorationRegression
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rustReceiptPath = Join-Path $rustOutput 'receipt.json'
          $rustReceipt = Get-Content -LiteralPath $rustReceiptPath -Raw | ConvertFrom-Json
          $rustExpected = @(
            'native_app_surface::embedding::tests::packaged_content_requires_its_ready_shell_frame'
            'native_app_surface::tests::attachment_waits_for_two_matching_ready_observations'
            'native_app_surface::tests::changed_or_missing_content_resets_attachment_readiness'
            'native_app_surface::tests::crash_containment_is_scoped_to_the_observed_packaged_notepad'
            'native_app_surface::tests::contained_notepad_is_fallback_without_embedding_or_process_ownership'
            'kernel_host::tests::source_revision_closed_dto_rejects_null_partial_and_unknown_binding'
            'kernel_host::tests::source_revision_dto_rejects_oversized_ids_and_invalid_attempts'
            'kernel_host::tests::source_revision_response_rejects_epoch_and_hash_boundaries'
            'kernel_host::tests::source_revision_response_requires_exact_scope_and_binding_correlation'
            'kernel_host::tests::source_revision_main_reads_use_broker_epoch_without_action_admission'
            'native_app_surface::embedding::tests::hosts_resizes_hides_and_restores_a_disposable_external_window'
            'native_app_surface::embedding::tests::restores_content_to_its_original_frame_after_hosting'
            'native_app_surface::embedding::tests::restores_a_hidden_content_frame_after_hosting'
            'native_app_surface::embedding::tests::restores_the_original_hidden_state_of_a_hosted_window'
          )
          $rustRows = @($rustReceipt.actualResultRows.PSObject.Properties)
          if ($rustReceipt.status -cne 'PASS_FOCUSED_RUST_CODE_ONLY' -or $rustReceipt.cargoExitCode -ne 0 -or
              $rustReceipt.expectedCount -ne 14 -or $rustRows.Count -ne 14 -or
              $rustReceipt.oneCargoInvocation -ne $true -or $rustReceipt.compilationIncluded -ne $true -or
              $rustReceipt.nativeAppAcceptance -ne $false -or @($rustReceipt.missing).Count -ne 0 -or
              @($rustReceipt.failed).Count -ne 0 -or @($rustReceipt.unexpected).Count -ne 0) {
            throw 'Actual Windows Rust test receipt is absent, incomplete, or failed.'
          }
          foreach ($row in $rustRows) {
            if ($rustExpected -cnotcontains $row.Name -or $row.Value -cne 'ok') { throw 'Windows Rust test name or result does not match the exact fourteen-case contract.' }
          }
          $rustExpectedArgs = @('test', '--locked', '--manifest-path', $rustManifest, '--lib', '--', '--exact', '--test-threads=1', '--color=never') + $rustExpected
          if (@($rustReceipt.arguments).Count -ne $rustExpectedArgs.Count) { throw 'Rust test invocation differs from the reviewed warm-target command.' }
          for ($index = 0; $index -lt $rustExpectedArgs.Count; $index++) {
            if ($rustReceipt.arguments[$index] -cne $rustExpectedArgs[$index]) { throw 'Rust test invocation differs from the reviewed warm-target command.' }
          }
          foreach ($key in $rustInputPaths.Keys) {
            if ((Get-FileHash -LiteralPath $rustInputPaths[$key] -Algorithm SHA256).Hash.ToLowerInvariant() -cne $rustInputHashes[$key]) {
              throw 'Frozen Rust test inputs changed during the test invocation.'
            }
          }
          $rustHeadAfter = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $rustHeadAfter -cne $rustHead -or [IO.Path]::GetFullPath($env:CARGO_TARGET_DIR) -cne $rustTarget) {
            throw 'Rust test source or warm target changed during the test invocation.'
          }
          $rustBinding = [ordered]@{
            schemaVersion = 1
            sourceSHA = $rustHead
            testScriptGitBlob = $rustPublishedScript
            inputSHA256 = $rustInputHashes
            targetDirectory = $rustTarget
            receiptSHA256 = (Get-FileHash -LiteralPath $rustReceiptPath -Algorithm SHA256).Hash.ToLowerInvariant()
            expectedCount = 14
            actualPassedCount = $rustRows.Count
            nativeAppAcceptance = $false
          }
          $rustBindingPath = Join-Path $rustOutput 'source-binding.json'
          $rustBindingBytes = [Text.UTF8Encoding]::new($false).GetBytes(($rustBinding | ConvertTo-Json -Depth 5))
          $rustBindingFile = [IO.File]::Open($rustBindingPath, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
          try { $rustBindingFile.Write($rustBindingBytes, 0, $rustBindingBytes.Length) } finally { $rustBindingFile.Dispose() }
          Write-Output 'PASS: fourteen actual Windows Rust test rows and frozen warm-target source binding.'

      - name: Inspect executable and DLL dependencies
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'MSVC installation not found.' }
          $dumpbin = Get-ChildItem -Path (Join-Path $vs 'VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe') -File | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin unavailable.' }
          $redist = Get-ChildItem -Path (Join-Path $vs 'VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT') -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $redist) { throw 'MSVC x64 CRT redistribution directory unavailable.' }
          $env:QA_MSVC_REDIST_DIR = $redist.FullName
          node scripts/native-windows-qa.mjs materialize-dlls
          if ($LASTEXITCODE -ne 0) { throw 'DLL materialization failed.' }
          $debug = Join-Path $env:CARGO_TARGET_DIR 'debug'
          $files = @((Get-Item -LiteralPath (Join-Path $debug 'jarvis.exe'))) + @(Get-ChildItem -LiteralPath 'work/native-windows-qa/materialized-dlls' -Filter '*.dll' -File)
          foreach ($file in $files) {
            & $dumpbin.FullName /DEPENDENTS $file.FullName | Out-File -FilePath work/native-windows-qa/dll-dependencies.txt -Append -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw 'DLL dependency inspection failed.' }
          }

      - name: Stage verified executable, DLLs and Tauri resources
        run: node scripts/native-windows-qa.mjs stage

      - name: Upload build-only artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-windows-debug-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/native-windows-qa/artifact/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
          # Only the explicitly staged verified payload is included; preserve its closure.
          include-hidden-files: true

      - name: Record uploaded artifact identity
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          "Source: $env:QA_SOURCE_SHA; artifact ID: $env:ARTIFACT_ID; upload SHA-256: $env:ARTIFACT_DIGEST" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-windows-qa-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/native-windows-qa/*.json
            work/native-windows-qa/*.txt
            work/native-windows-qa/*.log
            work/native-windows-qa/workbench-tests/**
            work/native-windows-qa/workbench-tests-admission/**
          if-no-files-found: warn
          retention-days: 3

  nsis-proof:
    # Build-only static package proof; executable/VM acceptance is a separate gate.
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      QA_SOURCE_SHA: ${{ inputs.source_sha }}
      QA_CARGO_LOCK_SHA256: ${{ inputs.cargo_lock_sha256 }}
      QA_WINDOWS_CONFIG_SHA256: ${{ inputs.windows_config_sha256 }}
      QA_CONNECTOR_SHA256: ${{ inputs.connector_source_sha256 }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/work/s61-unsigned-nsis-target
      ORT_CACHE_DIR: ${{ github.workspace }}/work/s61-unsigned-nsis-target/ort-cache
      CARGO_BUILD_JOBS: '1'
    steps:
      - name: Preserve published blob bytes before checkout
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.0
          targets: x86_64-pc-windows-msvc
      - name: Initialize source-bound unsigned package proof
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:QA_SOURCE_SHA -cnotmatch '^[a-f0-9]{40}$' -or (git rev-parse HEAD) -cne $env:QA_SOURCE_SHA) { throw 'Source identity mismatch.' }
          foreach ($value in @($env:QA_CARGO_LOCK_SHA256, $env:QA_WINDOWS_CONFIG_SHA256, $env:QA_CONNECTOR_SHA256)) {
            if ($value -cnotmatch '^[a-f0-9]{64}$') { throw 'Full lowercase SHA-256 required.' }
          }
          if ((Get-FileHash '.github/native-windows-qa/Cargo.lock').Hash.ToLowerInvariant() -cne $env:QA_CARGO_LOCK_SHA256) { throw 'Frozen lock mismatch.' }
          if ((Get-FileHash 'app/src-tauri/tauri.windows.conf.json').Hash.ToLowerInvariant() -cne $env:QA_WINDOWS_CONFIG_SHA256) { throw 'Windows configuration mismatch.' }
          Copy-Item '.github/native-windows-qa/Cargo.lock' 'app/src-tauri/Cargo.lock'
          $proof = Join-Path $env:GITHUB_WORKSPACE 'work/s61-nsis-proof'
          if (Test-Path -LiteralPath $proof) { throw 'Proof output already exists.' }
          New-Item -ItemType Directory -Path $proof | Out-Null
          $qaConfig = Join-Path $env:RUNNER_TEMP 's61-unsigned-nsis.generated.json'
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -LiteralPath $qaConfig -Encoding utf8NoBOM
          @("NSIS_PROOF_DIR=$proof", "NSIS_QA_CONFIG=$qaConfig", "VIBESPACE_CONNECTOR_BUILD_DIR=$(Join-Path $env:RUNNER_TEMP 's61-nsis-connector')", "VIBESPACE_SIYUAN_CACHE_DIR=$(Join-Path $env:RUNNER_TEMP 's61-nsis-siyuan')") | Add-Content -LiteralPath $env:GITHUB_ENV
          # Store a reusable stricter admission gate; the cold-tree estimates are projections.
          @'
          $ErrorActionPreference = 'Stop'
          $phase = $args[0]
          $volumes = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:CARGO_TARGET_DIR, $env:ORT_CACHE_DIR) | ForEach-Object { [IO.Path]::GetPathRoot($_) } | Sort-Object -Unique
          $timer = [Diagnostics.Stopwatch]::StartNew()
          $samples = [Collections.Generic.List[object]]::new()
          while ($true) {
            $os = Get-CimInstance Win32_OperatingSystem -OperationTimeoutSec 5
            try { $ram = [math]::Floor($os.FreePhysicalMemory / 1024); $commit = [math]::Floor($os.FreeVirtualMemory / 1024) } finally { $os.Dispose() }
            $disks = @($volumes | ForEach-Object {
              $id = $_.TrimEnd('\'); $d = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$id'" -OperationTimeoutSec 5
              if (-not $d) { throw 'Output/cache volume unavailable.' }
              try { @{ volume=$id; freeBytes=[long]$d.FreeSpace } } finally { $d.Dispose() }
            })
            $admitted = $ram -ge 11264 -and $commit -ge 16384 -and @($disks | Where-Object freeBytes -lt 21474836480).Count -eq 0
            $samples.Add(@{ freeRamMiB=$ram; freeCommitMiB=$commit; disks=$disks; admitted=$admitted; measuredAtUTC=[DateTime]::UtcNow.ToString('o') })
            @{ phase=$phase; freeRamMiB=$ram; freeCommitMiB=$commit; disks=$disks; estimatedPeakRamMiB=8192; estimatedPeakCommitMiB=12288; estimatedDiskBytes=21474836480; estimatesMeasured=$false; admitted=$admitted; measuredAtUTC=$samples[$samples.Count-1].measuredAtUTC; maxCapacityWaitSeconds=90; elapsedSeconds=$timer.Elapsed.TotalSeconds; samples=$samples.ToArray() } | ConvertTo-Json -Depth 7 | Set-Content (Join-Path $env:NSIS_PROOF_DIR ("capacity-"+$phase+'.json'))
            if ($admitted) { return }
            $remaining = 90 - $timer.Elapsed.TotalSeconds
            if ($remaining -le 0) { throw "NSIS capacity denied after bounded wait: RAM $ram/11264MiB, commit $commit/16384MiB; each output/cache volume requires20GiB. See capacity-$phase.json." }
            Write-Host "Waiting for changed runner capacity: RAM $ram/11264MiB; commit $commit/16384MiB. No build launched."
            Start-Sleep -Milliseconds ([int][math]::Min(10000, [math]::Ceiling($remaining*1000)))
          }
          '@ | Set-Content (Join-Path $proof 'admit.ps1') -Encoding utf8NoBOM
      - name: Admit cold resource preparation
        run: '& (Join-Path $env:NSIS_PROOF_DIR ''admit.ps1'') before-prepare'
      - name: Install locked build tools and verify installer contracts
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/install-windows.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cli = Get-Content node_modules/@tauri-apps/cli/package.json -Raw | ConvertFrom-Json
          if ($cli.version -cne '2.11.2') { throw 'Reaudit NSIS/tool pins for changed Tauri CLI.' }
      - name: Stage safe archive and actual package verifier
        run: |
          @'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {lstat,readdir,readFile,writeFile,mkdir,realpath} from 'node:fs/promises';
          import path from 'node:path';
          import {pathToFileURL} from 'node:url';
          const root=process.env.GITHUB_WORKSPACE, evidence=process.env.NSIS_PROOF_DIR;
          const {inspectPeImage,sha256,parseDllReports,verifyDllImports,inspectTauriNsisExecutableBinding}=await import(pathToFileURL(path.join(root,'scripts/native-windows-qa.mjs')));
          const {verifyResources}=await import(pathToFileURL(path.join(root,'scripts/s61-nsis-reinspect.mjs')));
          const connectorPreparation=await import(pathToFileURL(path.join(root,'scripts/prepare-desktop-connector.mjs')));
          const save=async(name,value)=>writeFile(path.join(evidence,name),JSON.stringify(value,null,2)+'\n');
          async function walk(dir,base=dir) {
            const files=[];
            for(const entry of await readdir(dir,{withFileTypes:true})) {
              const file=path.join(dir,entry.name), st=await lstat(file);
              assert(!st.isSymbolicLink() && (st.isDirectory()||st.isFile()),'Linked/special extracted entry');
              const rel=path.relative(await realpath(base),await realpath(file));
              assert(rel && !rel.startsWith('..') && !path.isAbsolute(rel),'Extracted path escape');
              if(st.isDirectory()) files.push(...await walk(file,base)); else files.push(file);
            }
            return files;
          }
          if(process.argv[2]==='extract') {
            const [tool,archive,out]=process.argv.slice(3);
            assert(!(await lstat(out).catch(()=>null)),'Extraction target must be new');
            const listing=execFileSync(tool,['l','-slt','-ba',archive],{encoding:'utf8',maxBuffer:64*1024*1024});
            const entries=listing.trim().split(/\r?\n\s*\r?\n/u).map(block=>Object.fromEntries(block.split(/\r?\n/u).map(line=>{ const i=line.indexOf(' = '); return i<0?[line,'']:[line.slice(0,i),line.slice(i+3)]; })));
            const seen=new Set();
            for(const entry of entries) {
              const name=entry.Path?.replaceAll('\\','/');
              assert(name && !name.startsWith('/') && !name.includes(':') && !name.split('/').some(x=>x==='..'||x==='.'||x===''),'Unsafe archive path');
              assert(!seen.has(name.toLowerCase()),'Archive case collision'); seen.add(name.toLowerCase());
              assert(!entry['Symbolic Link'] && !entry['Hard Link'] && !/L/u.test(entry.Attributes||''),'Archive link rejected');
            }
            await save(path.basename(out)+'-entries.json',entries);
            await mkdir(out);
            execFileSync(tool,['x','-y','-o'+out,archive],{encoding:'utf8',maxBuffer:64*1024*1024});
            const files=await walk(out), paths=new Set();
            for(const file of files) { const rel=path.relative(out,file).toLowerCase(); assert(!paths.has(rel),'Extracted case collision'); paths.add(rel); }
          } else if(process.argv[2]==='prove') {
            const [extracted,built,installer,dumpbin]=process.argv.slice(3);
            const files=await walk(extracted);
            const exes=files.filter(x=>path.basename(x).toLowerCase()==='jarvis.exe'); assert.equal(exes.length,1,'Exactly one installed jarvis.exe required');
            const exe=exes[0], appDir=path.dirname(exe);
            await save('package-files.json',await Promise.all(files.map(async file=>({path:path.relative(extracted,file).replaceAll('\\','/'),bytes:(await lstat(file)).size,sha256:await sha256(file)}))));
            const executableBinding=await inspectTauriNsisExecutableBinding(built,exe,{tauriCliVersion:'2.11.2',tauriBundlerSourceBlob:'ab0a45032f931af32b03c08ec5404c5cfe5c4891',bundleKind:'nsis'});
          await save('executable-binding.json',executableBinding);
          assert.equal(executableBinding.extractedExecutableSHA256,executableBinding.expectedNsisExecutableSHA256,'Extracted executable differs from exact pinned NSIS transformation');
            const pe=await inspectPeImage(exe);
