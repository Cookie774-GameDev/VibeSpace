            const inventory={sourceSHA:process.env.QA_SOURCE_SHA,executableSHA256:await sha256(exe),files:await Promise.all(dlls.map(async name=>({name,...await inspectPeImage(path.join(appDir,name),true),sha256:await sha256(path.join(appDir,name))})))};
