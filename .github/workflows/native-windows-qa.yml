            await save('package-proof.json',{sourceSHA:process.env.QA_SOURCE_SHA,sourceTree:execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),workflowSHA:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,installer:{file:path.basename(installer),bytes:(await lstat(installer)).size,sha256:await sha256(installer)},executable:{...pe,sha256:await sha256(exe)},cargoLockSHA256:await sha256(path.join(base,'Cargo.lock')),windowsConfigSHA256:await sha256(path.join(base,'tauri.windows.conf.json')),qaConfigSHA256:await sha256(process.env.NSIS_QA_CONFIG),verifierSHA256:await sha256(path.join(root,'scripts/native-windows-qa.mjs')),resources:resources.length,dlls:dlls.length,staticPackageProof:'PASS',installerExecuted:false,nativeAcceptance:'UNVERIFIED',cleanWindowsVM:'UNVERIFIED'});
