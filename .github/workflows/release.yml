# Build cross-platform installers and publish to GitHub Releases.
#
# Triggered by pushing a `v*` tag, manually dispatching a tag build, or
# pushing the one-use `v1.5.0` release branch after the release PR merges.
# Produces:
#   * Windows: NSIS .exe and .msi (x64)
#   * macOS:   DMG (Apple Silicon + Intel)
#   * Linux:   AppImage and .deb (x86_64)

name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'v1.5.0'
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.5.0)'
        required: true
        default: 'v1.5.0'

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  announce:
    if: github.event_name != 'create' || (github.ref_type == 'branch' && github.ref_name == 'v1.5.0')
    name: Announce release run
    runs-on: ubuntu-22.04
    steps:
      - name: Report live run on PR #27
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment 27 --repo "$GITHUB_REPOSITORY" --body "Official v1.5.0 release build started. Run ID: $GITHUB_RUN_ID | https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  release:
    needs: announce
    if: github.event_name != 'create' || (github.ref_type == 'branch' && github.ref_name == 'v1.5.0')
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - label: macOS x64
            platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - label: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
          - label: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry + build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare verified Desktop Connector resource
        run: npm run prepare:desktop-connector

      - name: Prepare verified SiYuan Windows runtime
        if: matrix.platform == 'windows-latest'
        run: npm run prepare:siyuan-runtime

      - name: Prepare signed updater release config
        shell: bash
        run: |
          node -e "const path=require('path'); require('fs').writeFileSync('app/src-tauri/tauri.release.generated.json', JSON.stringify({ bundle: { createUpdaterArtifacts: true, windows: { signCommand: { cmd: 'powershell', args: ['-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', path.resolve('scripts/sign-windows.ps1'), '%1'] } } } }))"

      - name: Build & publish (tauri-action)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.JARVIS_TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.JARVIS_TAURI_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_JARVIS_ADMIN: 'false'
          VITE_JARVIS_LOCAL_ADMIN: 'false'
          VITE_JARVIS_ADMIN_EMAILS: ''
          VITE_JARVIS_ADMIN_LOCAL_IDS: ''
          WINDOWS_CERT_BASE64: ${{ matrix.platform == 'windows-latest' && secrets.WINDOWS_CERT_BASE64 || '' }}
          WINDOWS_CERT_PASSWORD: ${{ matrix.platform == 'windows-latest' && secrets.WINDOWS_CERT_PASSWORD || '' }}
          WINDOWS_CERT_THUMBPRINT: ${{ matrix.platform == 'windows-latest' && secrets.WINDOWS_CERT_THUMBPRINT || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ matrix.platform == 'windows-latest' && secrets.WINDOWS_TIMESTAMP_URL || '' }}
          JARVIS_WINDOWS_SIGN_REQUIRED: '1'
        with:
          projectPath: app
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'VibeSpace ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            ## VibeSpace ${{ github.event.inputs.tag || github.ref_name }}

            See `releases/RELEASE_NOTES_1.5.0.md` in this release source for the full changelog.

            ### Install (one line)

            **Windows**
            ```
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/install/install.ps1 | iex
            ```

            **macOS / Linux**
            ```
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install/install.sh | bash
            ```

            ### Direct downloads
            See the assets below and verify them with `SHA256SUMS.txt`.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.generated.json

      - name: Verify Windows release Authenticode
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem -LiteralPath 'app/src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File)
          $msi = @(Get-ChildItem -LiteralPath 'app/src-tauri/target/release/bundle/msi' -Filter '*.msi' -File)
          $executable = Get-Item -LiteralPath 'app/src-tauri/target/release/jarvis.exe'
          if ($nsis.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($nsis.Count)." }
          if ($msi.Count -ne 1) { throw "Expected exactly one MSI installer, found $($msi.Count)." }
          if (-not $executable.PSIsContainer) { $releaseExecutable = $executable } else { throw 'Expected the Windows release executable to be a file.' }
          foreach ($artifact in @($releaseExecutable, $nsis[0], $msi[0])) {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Authenticode verification failed for $($artifact.Name): $($signature.Status)."
            }
          }

  checksums:
    name: Generate updater manifest and SHA256SUMS
    needs: release
    runs-on: ubuntu-22.04
    if: always() && (github.event_name != 'create' || (github.ref_type == 'branch' && github.ref_name == 'v1.5.0'))
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Stop if any platform build failed
        if: needs.release.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment 27 --repo "$GITHUB_REPOSITORY" --body "Official v1.5.0 release build failed on at least one platform. Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          exit 1

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets

      - name: Enforce PR31 release artifact size ceiling
        run: node scripts/verify-release-artifact-size.mjs --assets-dir assets

      - name: Require updater signatures and build latest.json
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! compgen -G "assets/*.sig" > /dev/null; then
            echo "Signed updater artifacts are required for an official release."
            exit 1
          fi
          UPDATER_PUBLIC_KEY="$(
            node -e "const config = require('./app/src-tauri/tauri.conf.json'); process.stdout.write(config.plugins.updater.pubkey)"
          )"
          test -n "$UPDATER_PUBLIC_KEY"
          for signature in assets/*.sig; do
            artifact="${signature%.sig}"
            test -f "$artifact"
            node scripts/verify-updater-signature.mjs \
              --artifact "$artifact" \
              --signature "$signature" \
              --public-key "$UPDATER_PUBLIC_KEY"
          done
          VERSION="${TAG#v}"
          node scripts/build-updater-manifest.mjs \
            --version "$VERSION" \
            --assets-dir assets \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            --outfile assets/latest.json \
            --notes "VibeSpace $VERSION"

      - name: Compute hashes
        run: |
          set -euo pipefail
          cd assets
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' | sort | xargs -r sha256sum | tee SHA256SUMS.txt
          test -s SHA256SUMS.txt

      - name: Upload updater manifest and hashes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release upload "$TAG" assets/latest.json assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
