<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VibeSpace · Live Chat Log</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f1e9;color:#202a2b;font:15px/1.5 'Segoe UI',sans-serif}header{padding:18px 24px;border-top:5px solid #145f54;border-bottom:1px solid #cbd1c8}h1{font:32px Georgia,serif;margin:0 0 8px}p{margin:6px 0}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}select,button{font:inherit;padding:6px 10px;max-width:55vw}#status{color:#145f54}iframe{width:100%;height:calc(100vh - 180px);border:0;display:block}small{color:#526260}
</style></head><body><header><h1>VibeSpace · Live Chat Log</h1><div class="controls"><label>Chat <select id="chat"><option value="">Follow active / latest chat</option></select></label><button id="download" disabled>Download HTML snapshot</button></div><p id="status" role="status">Connecting to the native app…</p><small>Live HTML outside VibeSpace · refreshes every 2 seconds · read-only · provider-exposed reasoning only</small></header><iframe title="Chat diagnostic report" sandbox="allow-same-origin" referrerpolicy="no-referrer" hidden></iframe>
<script>
const select=document.querySelector('#chat'),status=document.querySelector('#status'),frame=document.querySelector('iframe'),download=document.querySelector('#download');
let last=null,generation=0,position=null;
select.addEventListener('change',()=>{generation++;last=null;frame.hidden=true;frame.srcdoc='';download.disabled=true;status.textContent='Switching chat…';});
frame.addEventListener('load',()=>{const doc=frame.contentDocument;if(!doc||!position)return;const radio=doc.querySelector(position.detailed?'#detailed':'#simple');if(radio)radio.checked=true;doc.querySelectorAll('details').forEach((item,index)=>{if(index<position.open.length)item.open=position.open[index];});if(doc.scrollingElement)doc.scrollingElement.scrollTop=position.scroll;});
async function refresh(){const epoch=generation;try{const response=await fetch('snapshot?chat='+encodeURIComponent(select.value),{cache:'no-store',signal:AbortSignal.timeout(20000)});if(!response.ok)throw new Error('unavailable');const next=await response.json();if(epoch!==generation)return;
const selected=select.value;select.replaceChildren(new Option('Follow active / latest chat',''),...next.chats.map(chat=>new Option(chat.title||chat.id,chat.id)));select.value=selected;
const doc=frame.contentDocument;position=last?.chatId===next.chatId&&doc?.querySelector('#detailed')?{detailed:doc.querySelector('#detailed').checked,scroll:doc.scrollingElement?.scrollTop??0,open:Array.from(doc.querySelectorAll('details')).map(item=>item.open)}:null;
last=next;frame.srcdoc=next.html;frame.hidden=!next.html;download.disabled=!next.html;status.textContent=next.html?'LIVE · Connected to native chat records · Updated '+new Date(next.updatedAt).toLocaleTimeString()+' · '+next.messages+' messages · '+next.runs+' runs':'Connected · No chats in the active workspace';
}catch{if(epoch===generation){last=null;frame.srcdoc='';frame.hidden=true;download.disabled=true;status.textContent='DISCONNECTED · Native app or log data unavailable. Retrying automatically…';}}finally{setTimeout(refresh,2000);}}
download.addEventListener('click',()=>{if(!last?.html)return;const url=URL.createObjectURL(new Blob([last.html],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='vibespace-chat-log-'+last.chatId.replace(/[^a-z0-9_-]/gi,'_')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
refresh();
</script></body></html>
