[project]
name = "vibespace-model-foundry-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate==1.8.1",
  "peft==0.16.0",
  "pillow==12.3.0",
  "av==15.1.0",
  "safetensors==0.5.3",
  "torch==2.7.1",
  "transformers==4.53.2",
]

[project.optional-dependencies]
qlora = [
  "bitsandbytes==0.46.1; platform_system != 'Darwin'",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
