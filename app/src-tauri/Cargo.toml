[package]
name = "jarvis"
version = "1.5.0"
description = "The AI workspace where every model, agent, voice, and task lives under one persistent memory and one always-available assistant."
authors = ["Jarvis"]
edition = "2021"
rust-version = "1.85"

# We compile to a library so mobile platforms can link the entry point through
# their platform frameworks. Desktop binaries also link this lib via main.rs.
[lib]
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api", "unstable"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
tauri-plugin-http = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
sha2 = "0.10"
minisign-verify = "=0.2.5"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
pdf-extract = "=0.12.0"
# Cargo.lock is intentionally not tracked for this Tauri package; pin the
# security-sensitive parser selected by pdf-extract so clean builds cannot drift.
lopdf = { version = "=0.42.0", default-features = false, features = ["wasm_js"] }
base64 = "0.22"
cap-std = "=3.4.5"
cap-fs-ext = "=3.4.5"
fs4 = "=0.8.4"
async-lock = "=3.3.0"
tantivy = { version = "=0.22.1", default-features = false, features = ["mmap", "lz4-compression"] }
# Exact guards keep Tantivy's otherwise-new Rayon closure within the crate's Rust 1.78 floor.
rayon = "=1.10.0"
rayon-core = "=1.12.1"

# PTY terminal backend (slice 1 of Wave 4 — multi-pane terminal grid).
portable-pty = "0.8"
nanoid = "0.4"
piper-rs = { version = "0.2.0", optional = true }
hound = "3.5.1"

[target.'cfg(unix)'.dependencies]
users = { version = "=0.11.0", default-features = false }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
winreg = "0.52"
tauri-winrt-notification = "0.7.3"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

# Default development profile – optimise compile times.
[profile.dev]
incremental = true

# Keep repeated native runtime integrity checks fast in tauri:dev.
# Hash the same bytes with the same algorithm; only optimize this dependency.
[profile.dev.package.sha2]
opt-level = 3

# Production profile – Tauri's recommended settings for smaller, faster bundles.
#
# We use `thin` LTO and 4 codegen-units instead of `lto=true` + `codegen-units=1`
# because:
#   - Thin LTO gives us the bulk of the size/perf wins (Chromium and Firefox
#     ship thin LTO releases) at a fraction of the peak memory cost.
#   - `codegen-units = 1` was forcing rustc to hold the entire `tauri` crate's
#     IR in memory during optimization (>4 GB peak), which overflows on machines
#     with constrained RAM during the link step. 4 units parallelises the work
#     and keeps each unit's footprint manageable while still letting LTO span
#     them at the end.
# The resulting binary is typically within 1-3% of the size you'd get from
# full LTO with codegen-units=1, and noticeably faster to build.
[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = "symbols"

[features]
default = ["jarvis-voice"]
jarvis-voice = ["dep:piper-rs"]

[patch.crates-io]
espeak-rs-sys = { path = "vendor/espeak-rs-sys-0.2.0" }
dirs = { path = "vendor/dirs-local-6.0.0" }
# Backport upstream #1215 without changing Tao's public API or other platforms.
tao = { path = "vendor/tao-0.35.3" }
